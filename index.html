<meta property="og:description" content="Criamos websites e soluções digitais, e fazemos a gestão das redes sociais do teu negócio.">

<meta property="og:url" content="https://bio.dddigital.pt/">

<meta property="og:image:width" content="1200">

<style>
  /* ===== CORES E MEDIDAS — as mesmas do site dddigital.pt ===== */
  :root{
    --branco:#FFFFFF;
    --nevoa:#F7F8F5;        /* fundo da página */
    --tinta:#2E2E2E;        /* texto principal */
    --cinza:#4A5F54;        /* texto secundário */
    --suave:#6B8F7A;        /* detalhes */
    --linha:#E3E8E1;        /* bordas finas */
    --verde:#0F2D24;        /* verde profundo: cor principal */
    --verde-escuro:#163F2E;
    --menta:#EAF5D6;        /* fundo das etiquetas e ícones */
    --lima:#A7E63A;         /* destaque */
    --fonte:'Montserrat','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --fonte-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --raio:14px;
    --raio-pequeno:10px;
    --sombra:0 1px 2px rgba(46,46,46,.04);
    --sombra-alta:0 12px 32px rgba(46,46,46,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:var(--fonte);
    color:var(--tinta);
    -webkit-font-smoothing:antialiased;
    /* brilho lima + grelha ténue, como no início do site (só CSS, sem imagens) */
    background:
      radial-gradient(620px 380px at 88% -4%, rgba(167,230,58,.22), transparent 62%),
      radial-gradient(460px 300px at 4% 6%, rgba(15,45,36,.07), transparent 60%),
      var(--nevoa);
    display:flex;justify-content:center;
    /* zonas seguras do telemóvel (notch, barra inferior) */
    padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(to right,rgba(46,46,46,.04) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(46,46,46,.04) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 60% 10%,#000 0%,transparent 70%);
    mask-image:radial-gradient(circle at 60% 10%,#000 0%,transparent 70%);
  }
  .wrap{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}

  :focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:6px}

  /* seletor de idioma PT | EN */
  .lang{align-self:flex-end;display:flex;gap:2px;padding:3px;background:var(--branco);border:1px solid var(--linha);border-radius:999px}
  .lang button{
    font:inherit;font-family:var(--fonte-mono);font-size:12px;font-weight:700;letter-spacing:.06em;
    min-height:44px;min-width:48px;padding:4px 14px;
    border:0;background:transparent;color:var(--cinza);border-radius:999px;cursor:pointer;
    transition:background-color .2s,color .2s;
  }
  .lang button:hover{color:var(--verde)}
  .lang button[aria-pressed="true"]{background:var(--verde);color:var(--branco)}

  /* cabeçalho: logo, nome, etiqueta e frase */
  .logo{margin-top:14px;width:132px}
  .logo img{width:100%;height:auto;display:block}
  h1{margin-top:20px;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-align:center}
  h1 span{color:var(--verde)}
  .etiqueta{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    font-family:var(--fonte-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--verde-escuro);background:var(--menta);padding:6px 12px;border-radius:100px;text-align:center;
  }
  .etiqueta::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--verde);flex:none}
  .bio{margin-top:16px;font-size:15.5px;line-height:1.6;color:var(--cinza);text-align:center;max-width:340px}

  /* fila de botões pequenos (Website, Email, Instagram, Partilhar) */
  .rapidos{margin-top:22px;display:flex;justify-content:center;gap:10px;width:100%}
  .rapido{
    flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:2px 0;background:none;border:0;font:inherit;color:var(--cinza);
    font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .rapido[hidden]{display:none}
  .rapido__ico{
    width:56px;height:56px;border-radius:var(--raio);display:grid;place-items:center;
    background:var(--branco);border:1px solid var(--linha);color:var(--verde-escuro);box-shadow:var(--sombra);
    transition:transform .2s,border-color .2s,box-shadow .2s,background-color .2s;
  }
  .rapido__ico svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .rapido:hover .rapido__ico{transform:translateY(-2px);border-color:rgba(15,45,36,.45);box-shadow:var(--sombra-alta)}
  .rapido:active .rapido__ico{transform:translateY(0)}
  .rapido:hover{color:var(--verde)}
  .rapido.e-feito .rapido__ico{background:var(--menta);border-color:var(--verde)}

  /* botões */
  .links{margin-top:28px;width:100%;display:flex;flex-direction:column;gap:12px}
  .grupo{
    margin:14px 0 -2px 4px;
    font-family:var(--fonte-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);
  }
  .link{
    display:flex;align-items:center;gap:15px;min-height:72px;padding:14px 18px;
    background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);
    color:var(--tinta);text-decoration:none;box-shadow:var(--sombra);
    transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  .link:hover{transform:translateY(-2px);border-color:rgba(15,45,36,.45);box-shadow:var(--sombra-alta)}
  .link:active{transform:translateY(0)}
  .ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--menta);color:var(--verde-escuro)}
  .ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .txt{flex:1;min-width:0}
  .txt strong{display:block;font-size:16px;font-weight:600}
  .txt span{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--cinza);overflow-wrap:anywhere}
  .arrow{flex:none;width:18px;height:18px;stroke:var(--suave);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s,stroke .2s}
  .link:hover .arrow{stroke:var(--verde);transform:translateX(3px)}

  /* ação principal: verde profundo com detalhe lima */
  .link--principal{
    min-height:82px;background:var(--verde);border-color:var(--verde);color:var(--branco);
    background-image:radial-gradient(260px 120px at 100% 0%,rgba(167,230,58,.25),transparent 65%);
    box-shadow:var(--sombra-alta);
  }
  .link--principal:hover{background-color:var(--verde-escuro);border-color:var(--verde-escuro)}
  .link--principal .ico{background:var(--lima);color:var(--verde)}
  .link--principal .txt strong{font-size:17px}
  .link--principal .txt span{color:rgba(255,255,255,.78)}
  .link--principal .arrow,.link--principal:hover .arrow{stroke:var(--lima)}
  .link--principal:focus-visible{outline-color:var(--lima)}

  /* blocos informativos (O que fazemos / Como trabalhamos) */
  .bloco{width:100%;margin-top:34px}
  .bloco .grupo{margin:0 0 10px 4px}

  /* O que fazemos: um só cartão com 3 linhas */
  .painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);overflow:hidden}
  .servico{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--linha)}
  .servico .ico{width:40px;height:40px;border-radius:11px}
  .servico .ico svg{width:20px;height:20px}
  .servico h3{font-size:15px;font-weight:600;line-height:1.3}
  .servico p{margin-top:2px;font-size:13px;line-height:1.4;color:var(--cinza)}
  .painel__mais{
    display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 18px;
    background:var(--nevoa);color:var(--verde-escuro);font-size:14px;font-weight:600;text-decoration:none;
    transition:background-color .2s;
  }
  .painel__mais:hover{background:var(--menta)}
  .painel__mais svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .painel__mais:hover svg{transform:translateX(3px)}

  /* Como trabalhamos: 4 passos, com a linha a ficar verde ao aparecer no ecrã */
  .passos{list-style:none;counter-reset:passo}
  .passo{position:relative;display:flex;gap:16px;padding-bottom:22px;counter-increment:passo}
  .passo:last-child{padding-bottom:0}
  .passo::before{ /* a linha entre os círculos */
    content:'';position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--linha);transition:background-color .6s ease .1s;
  }
  .passo:last-child::before{display:none}
  .passo.e-visivel::before{background:var(--verde)}
  .passo__n{
    position:relative;flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    background:var(--branco);border:2px solid var(--linha);color:var(--cinza);
    font-family:var(--fonte-mono);font-size:13px;font-weight:700;transition:background-color .4s,border-color .4s,color .4s;
  }
  .passo__n::before{content:counter(passo)}
  .passo.e-visivel .passo__n{background:var(--verde);border-color:var(--verde);color:var(--branco)}
  .passo h3{font-size:15px;font-weight:600;line-height:1.3;padding-top:4px}
  .passo p{margin-top:2px;font-size:13px;line-height:1.45;color:var(--cinza)}

  /* rodapé */
  footer{margin-top:auto;padding-top:40px;width:100%;text-align:center}
  .legal[hidden]{display:none}
  .legal{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px}
  .legal button,.legal a{font:inherit;background:none;border:0;color:var(--cinza);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:10px 2px}
  .legal button:hover,.legal a:hover{color:var(--verde)}
  .copy{margin-top:8px;font-size:12px;color:var(--cinza)}
  .credito{margin-top:2px;font-size:12px;color:var(--cinza)}
  .credito a{color:var(--verde-escuro);font-weight:600;text-underline-offset:3px;padding:10px 2px}
  .credito a:hover{color:var(--verde)}

  /* janelas Aviso Legal / Privacidade */
  dialog{
    margin:auto;width:min(92vw,520px);max-height:85vh;
    background:var(--branco);color:var(--tinta);
    border:1px solid var(--linha);border-radius:var(--raio);padding:0;box-shadow:var(--sombra-alta);
  }
  dialog::backdrop{background:rgba(15,45,36,.45);backdrop-filter:blur(3px)}
  .dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 12px;position:sticky;top:0;background:var(--branco);border-bottom:1px solid var(--linha)}
  .dhead h2{font-size:17px;font-weight:600}
  .dclose{width:44px;height:44px;border-radius:50%;border:1px solid var(--linha);background:var(--nevoa);color:var(--tinta);font-size:20px;line-height:1;cursor:pointer}
  .dclose:hover{border-color:var(--verde)}
  .dbody{padding:16px 22px 24px;overflow:auto;max-height:calc(85vh - 76px);font-size:14px;line-height:1.65;color:var(--cinza)}
  .dbody h3{margin:16px 0 4px;font-family:var(--fonte-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--verde-escuro);font-weight:600}
  .dbody p+p{margin-top:8px}
  .dbody a{color:var(--verde-escuro)}
  .dbody ul{margin:6px 0 0 18px}

  /* entrada suave, um bloco depois do outro */
  @keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .logo,h1,.etiqueta,.bio,.rapidos,.links>*,.bloco,footer{animation:entra .55s ease-out both;animation-delay:calc(var(--i,0) * 60ms)}

  /* quem tem "reduzir movimento" ligado não vê animações */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  /* PC: continua a ser uma coluna centrada */
  @media (min-width:700px){
    body{padding-top:48px;padding-bottom:40px}
    h1{font-size:32px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="lang" role="group" aria-label="Language / Idioma">
    <button type="button" data-lang="pt" aria-pressed="true">PT</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <!-- LOGO: para trocar, substituir o ficheiro img/logo.webp (mantendo o nome) -->
  <div class="logo" style="--i:1">
    <img src="img/logo.webp" alt="DD Digital" width="480" height="279" fetchpriority="high">
  </div>

  <h1 style="--i:2"><span>DD</span> Digital</h1>
  <p class="etiqueta" style="--i:3" data-i18n="tag"></p>
  <p class="bio" style="--i:4" data-i18n="bio"></p>

  <!-- ===== BOTÕES PEQUENOS: Website, Email, Instagram, Partilhar =====
       O Instagram só aparece depois de preencheres CONFIG.instagram (no fim do ficheiro). -->
  <div class="rapidos" style="--i:5">
    <a class="rapido" id="l-site" href="https://dddigital.pt/" target="_blank" rel="noopener">
      <span class="rapido__ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg></span>
      <span data-i18n="q_site"></span>
    </a>
    <a class="rapido" id="l-mail" href="mailto:dddigital.pt@gmail.com">
      <span class="rapido__ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span>
      <span data-i18n="q_mail"></span>
    </a>
    <a class="rapido" id="l-ig" href="#" target="_blank" rel="noopener" hidden>
      <span class="rapido__ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4"/><path d="M17.3 6.7h.01"/></svg></span>
      <span>Instagram</span>
    </a>
    <!-- Partilhar é uma ação (abre o menu de partilhar do telemóvel), por isso é um botão -->
    <button class="rapido" id="b-share" type="button">
      <span class="rapido__ico"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg></span>
      <span id="t-share" data-i18n="q_share"></span>
    </button>
  </div>

  <!-- ===== LINKS: editar aqui =====
       Cada botão é um bloco <a class="link"> igual aos outros.
       Os botões "No nosso site" apontam para uma SECÇÃO do site (âncora #...).
       Os endereços das secções estão todos juntos em CONFIG.sections, no fim do ficheiro. -->
  <nav class="links" aria-label="Links">
    <!-- Ação principal -->
    <a class="link link--principal" style="--i:6" id="l-contacto" href="https://dddigital.pt/#contacto" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg></span>
      <span class="txt"><strong data-i18n="b_contact"></strong><span data-i18n="b_contact_s"></span></span>
      <svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </nav>

  <!-- ===== O QUE FAZEMOS: 3 serviços (textos em T, no fim do ficheiro) ===== -->
  <section class="bloco" style="--i:7" aria-labelledby="h-fazemos">
    <h2 class="grupo" id="h-fazemos" data-i18n="g_do"></h2>
    <div class="painel">
      <div class="servico">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M3 9h18M8 21h8M12 18v3"/></svg></span>
        <div><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></div>
      </div>
      <div class="servico">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M13.5 17.25h7.5M17.25 13.5v7.5"/></svg></span>
        <div><h3 data-i18n="s4_t"></h3><p data-i18n="s4_d"></p></div>
      </div>
      <div class="servico">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.8a4.3 4.3 0 0 1 7.5 2.7c0 5.4-7.5 10-7.5 10z"/></svg></span>
        <div><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></div>
      </div>
      <div class="servico">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
        <div><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></div>
      </div>
      <a class="painel__mais" id="l-servicos" href="https://dddigital.pt/#servicos" target="_blank" rel="noopener">
        <span data-i18n="b_services"></span>
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
  </section>

  <!-- ===== COMO TRABALHAMOS: 4 passos ===== -->
  <section class="bloco" style="--i:8" aria-labelledby="h-como">
    <h2 class="grupo" id="h-como" data-i18n="g_how"></h2>
    <ol class="passos">
      <li class="passo"><span class="passo__n" aria-hidden="true"></span><div><h3 data-i18n="p1_t"></h3><p data-i18n="p1_d"></p></div></li>
      <li class="passo"><span class="passo__n" aria-hidden="true"></span><div><h3 data-i18n="p2_t"></h3><p data-i18n="p2_d"></p></div></li>
      <li class="passo"><span class="passo__n" aria-hidden="true"></span><div><h3 data-i18n="p3_t"></h3><p data-i18n="p3_d"></p></div></li>
      <li class="passo"><span class="passo__n" aria-hidden="true"></span><div><h3 data-i18n="p4_t"></h3><p data-i18n="p4_d"></p></div></li>
    </ol>
  </section>

  <nav class="links" style="margin-top:34px" aria-label="FAQ">
    <a class="link" style="--i:9" id="l-faq" href="https://dddigital.pt/#faq" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8M12 17h.01"/></svg></span>
      <span class="txt"><strong data-i18n="b_faq"></strong><span data-i18n="b_faq_s"></span></span>
      <svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </nav>
  <!-- ===== fim dos LINKS ===== -->

  <footer style="--i:10">
    <!--
      LINKS LEGAIS ESCONDIDOS (ainda não há empresa constituída).
      Para voltar a mostrar: apagar o atributo "hidden" da linha abaixo
      e preencher os dados em CONFIG (nome, NIF, morada) mais abaixo.

    legal: (c)=>`

      <p>Atividade: criação e gestão de websites e soluções digitais. Marca comercial: DD Digital.</p>
      <h3>Resolução de litígios de consumo</h3>
      <p>Em caso de litígio, o consumidor pode recorrer às entidades de Resolução Alternativa de Litígios (RAL) de consumo. Lista de entidades em <a href="https://www.consumidor.gov.pt" target="_blank" rel="noopener noreferrer">consumidor.gov.pt</a>.</p>
      <p>Pode também apresentar uma reclamação através do <a href="${c.complaintsUrl}" target="_blank" rel="noopener noreferrer">Livro de Reclamações Eletrónico</a>.</p>
      <h3>Propriedade intelectual</h3>
      <p>A marca, o logótipo e os conteúdos desta página pertencem à DD Digital e não podem ser reproduzidos sem autorização.</p>
      <h3>Links externos</h3>
      <p>Esta página contém links para o nosso website, que tem a sua própria informação legal e política de privacidade.</p>`,
    privacy: (c)=>`
      <h3>Responsável pelo tratamento</h3>
      <p>${c.legalName} (NIF ${c.nif}) — <a href="mailto:${c.email}">${c.email}</a>.</p>
      <h3>Que dados recolhemos nesta página</h3>
      <p>Esta página <strong>não recolhe dados pessoais</strong>, não usa cookies, não usa ferramentas de análise nem de publicidade, e não carrega fontes ou scripts de terceiros.</p>
      <p>Apenas guardamos, no seu dispositivo (armazenamento local), a sua escolha de idioma (PT/EN), para a lembrar numa próxima visita. Esta informação não sai do seu dispositivo.</p>
      <h3>Quando entra em contacto</h3>
      <ul>
        <li><strong>Email:</strong> ao escrever-nos, tratamos o seu endereço e a sua mensagem para lhe responder (art. 6.º, n.º 1, al. b) e f) do RGPD). Conservamos a comunicação apenas pelo tempo necessário.</li>
        <li><strong>Formulário no website:</strong> o tratamento dos dados é descrito na Política de Privacidade do website.</li>
      </ul>
      <p>O serviço de email pode ser prestado por um subcontratante (Google), nos termos da respetiva política.</p>
      <h3>Os seus direitos</h3>
      <p>Pode solicitar o acesso, retificação, apagamento, limitação, portabilidade e oposição ao tratamento dos seus dados, através de <a href="mailto:${c.email}">${c.email}</a>. Tem também o direito de apresentar reclamação à autoridade de controlo: <a href="https://www.cnpd.pt" target="_blank" rel="noopener noreferrer">CNPD – Comissão Nacional de Proteção de Dados</a>.</p>
      <p><em>Última atualização: outubro de 2026.</em></p>`
  },
  en: {
    tag: "Websites / Digital Solutions",
    bio: "We build websites and digital solutions, and manage your business's social media.",
    q_site: "Website", q_mail: "Email", q_share: "Share", q_copied: "Link copied!",
    g_do: "What we do", g_how: "How we work",
    s1_t: "Websites", s1_d: "Fast pages tailored to your brand.",
    s4_t: "Digital solutions", s4_d: "Guides, biolinks, digital menus and more.",
    s2_t: "Social media", s2_d: "Content management and online presence.",
    s3_t: "Maintenance", s3_d: "Your site kept up to date, secure and running.",
    p1_t: "Chat", p1_d: "We get to know your business and what you need.",
    p2_t: "Proposal", p2_d: "You get a clear quote, no surprises.",
    p3_t: "Creation", p3_d: "We design and build, with your input.",
    p4_t: "Live", p4_d: "We launch the project and stay close.",
    b_contact: "Get in touch", b_contact_s: "Ask for a no-obligation quote",
    b_services: "See all services",
    b_faq: "FAQ", b_faq_s: "Still have questions?",
    f_legal: "Legal Notice", f_privacy: "Privacy", f_complaints: "Complaints Book (PT)", f_credit: "Created by",
    legal: (c)=>`
      <h3>Provider identification</h3>
      <p><strong>${c.legalName}</strong><br>Tax ID (NIF): ${c.nif}<br>Address: ${c.address}<br>Email: <a href="mailto:${c.email}">${c.email}</a>${c.phone?`<br>Phone: ${c.phone}`:""}${c.cae?`<br>Activity code (CAE): ${c.cae}`:""}</p>
      <p>Activity: website creation and management and digital solutions. Trade name: DD Digital.</p>
      <h3>Consumer dispute resolution</h3>
      <p>In case of a dispute, consumers may use Portuguese Alternative Dispute Resolution (ADR) bodies. The list of entities is available at <a href="https://www.consumidor.gov.pt" target="_blank" rel="noopener noreferrer">consumidor.gov.pt</a>.</p>
      <p>You may also file a complaint through the <a href="${c.complaintsUrl}" target="_blank" rel="noopener noreferrer">Electronic Complaints Book</a> (Portugal).</p>
      <h3>Intellectual property</h3>
      <p>The brand, logo and content of this page belong to DD Digital and may not be reproduced without permission.</p>
      <h3>External links</h3>
      <p>This page links to our website, which has its own legal information and privacy policy.</p>`,
    privacy: (c)=>`
      <h3>Data controller</h3>
      <p>${c.legalName} (Tax ID ${c.nif}) — <a href="mailto:${c.email}">${c.email}</a>.</p>
      <h3>What data we collect on this page</h3>
      <p>This page <strong>does not collect personal data</strong>, uses no cookies, no analytics or advertising tools, and loads no third-party fonts or scripts.</p>
      <p>We only store your language choice (PT/EN) in your device's local storage so we can remember it on your next visit. This information never leaves your device.</p>
      <h3>When you contact us</h3>
      <ul>
        <li><strong>Email:</strong> when you write to us, we process your address and message to reply (Art. 6(1)(b) and (f) GDPR). We keep the communication only as long as necessary.</li>
        <li><strong>Website form:</strong> data processing is described in the website's Privacy Policy.</li>
      </ul>
      <p>Email may be provided through a processor (Google), under its own terms.</p>
      <h3>Your rights</h3>
      <p>You may request access, rectification, erasure, restriction, portability and object to processing of your data at <a href="mailto:${c.email}">${c.email}</a>. You also have the right to lodge a complaint with the supervisory authority: <a href="https://www.cnpd.pt" target="_blank" rel="noopener noreferrer">CNPD – Portuguese Data Protection Authority</a>.</p>
      <p><em>Last updated: October 2026.</em></p>`
  }
};

(function(){
  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
  $("#yr").textContent = new Date().getFullYear();
  $("#l-mail").href = "mailto:" + CONFIG.email;
  if(CONFIG.instagram){ $("#l-ig").href = CONFIG.instagram; $("#l-ig").hidden = false; }

  // Liga cada botão à secção certa do site, no idioma escolhido
  function setLinks(l){
    const s = CONFIG.sections[l];
    $("#l-site").href = s.base;
    $("#l-contacto").href = s.base + s.contact;
    $("#l-servicos").href = s.base + s.services;
    $("#l-faq").href = s.base + s.faq;
  }

  function setLang(l){
    const t = T[l]; if(!t) return;
    document.documentElement.lang = l==="pt" ? "pt-PT" : "en";
    $$("[data-i18n]").forEach(el=>{ const v=t[el.dataset.i18n]; if(typeof v==="string") el.textContent=v; });
    setLinks(l);
    $("#b-legal").innerHTML = t.legal(CONFIG);
    $("#b-privacy").innerHTML = t.privacy(CONFIG);
    $$(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
    $$(".dclose").forEach(b=>b.setAttribute("aria-label", l==="pt"?"Fechar":"Close"));
    try{ localStorage.setItem("dd-lang", l); }catch(e){}
  }

  // Passos: a linha fica verde quando o passo aparece no ecrã (sem suporte = tudo verde logo)
  const passos = $$(".passo");
  if("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    const obs = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("e-visivel"); obs.unobserve(e.target); } }), {threshold:.6});
    passos.forEach((p,i)=>{ p.style.transitionDelay = (i*0.12)+"s"; obs.observe(p); });
  } else passos.forEach(p=>p.classList.add("e-visivel"));

  // Idioma por defeito: português. Só muda se o visitante escolher EN (fica guardado).
  let initial = "pt";
  try{ if(localStorage.getItem("dd-lang")==="en") initial = "en"; }catch(e){}
  setLang(initial);

  $$(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

  // Partilhar: abre o menu de partilha do telemóvel; se não existir (PC), copia o link
  $("#b-share").addEventListener("click", async ()=>{
    const url = location.href.split("#")[0];
    const lang = document.documentElement.lang.startsWith("en") ? "en" : "pt";
    try{
      if(navigator.share){ await navigator.share({ title: document.title, url }); return; }
      await navigator.clipboard.writeText(url);
    }catch(e){ return; }  // o visitante fechou o menu de partilha ou o browser não deixou copiar
    const btn = $("#b-share"), txt = $("#t-share");
    txt.textContent = T[lang].q_copied; btn.classList.add("e-feito");
    setTimeout(()=>{ txt.textContent = T[lang].q_share; btn.classList.remove("e-feito"); }, 2000);
  });
  $$("[data-open]").forEach(b=>b.addEventListener("click",()=>$("#"+b.dataset.open).showModal()));
  $$("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
  $$("dialog").forEach(d=>d.addEventListener("click",e=>{ if(e.target===d) d.close(); }));
})();
</script>
</body>
</html>
